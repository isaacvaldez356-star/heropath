<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HeroPath — Tu camino legendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8A6A28;
  --purple:#7B5EA7;--purple-light:#A07FCC;--purple-dark:#4A3270;
  --teal:#2BBFA0;--bg:#0A0A0F;--bg2:#12121A;--bg3:#1A1A26;--bg4:#222233;
  --border:rgba(201,168,76,0.15);--border2:rgba(201,168,76,0.3);
  --text:#E8E0D0;--text2:#A09880;--text3:#665E50;
  --red:#C0392B;--orange:#E67E22;
  --font-title:'Cinzel',serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6;min-height:100vh;}
h1,h2,h3{font-family:var(--font-title);font-weight:500;letter-spacing:0.05em;}
button{cursor:pointer;border:none;background:none;font-family:var(--font-body);color:var(--text);}
button:disabled{cursor:not-allowed;}
input,textarea{font-family:var(--font-body);}
a{color:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:2px;}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:16px;}
.card-sm{background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:20px;border:0.5px solid;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;transition:all .2s;cursor:pointer;border:0.5px solid var(--border2);text-decoration:none;}
.btn-gold{background:var(--gold);color:#0A0A0F;border-color:var(--gold);}
.btn-gold:hover{background:var(--gold-light);}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2);}
.btn-ghost:hover{color:var(--text);border-color:var(--gold);}
.btn-chip{flex-shrink:0;padding:4px 10px;border-radius:20px;font-size:11px;display:inline-flex;align-items:center;gap:4px;border:0.5px solid;text-decoration:none;transition:all .2s;}
.prog-bar{height:4px;border-radius:2px;background:var(--bg4);overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none;transition:border .2s;}
.input:focus{border-color:var(--gold);}
.input::placeholder{color:var(--text3);}
.icon-box{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn .3s ease forwards;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet{animation:slideUp .3s ease forwards;}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0) scale(1);}40%{transform:translateY(-30px) scale(1.3);}100%{opacity:0;transform:translateY(-70px) scale(0.9);}}
.xp-toast{animation:xpFloat 1.4s ease forwards;position:fixed;z-index:9999;pointer-events:none;font-family:var(--font-title);font-size:22px;font-weight:700;color:var(--gold);text-shadow:0 0 24px rgba(201,168,76,0.9);white-space:nowrap;}
@keyframes rankAnim{0%{transform:scale(0.6);opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
.rank-anim{animation:rankAnim .5s ease forwards;}
@keyframes rewardIn{0%{opacity:0;transform:translateY(-10px);}10%,85%{opacity:1;transform:translateY(0);}100%{opacity:0;}}
.reward{animation:rewardIn 3.5s ease forwards;}
.spinner{border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{background:rgba(192,57,43,0.12);border:0.5px solid rgba(192,57,43,0.4);border-radius:8px;padding:10px 14px;font-size:12px;color:#E07060;}
.ok{background:rgba(43,191,160,0.1);border:0.5px solid rgba(43,191,160,0.35);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--teal);}
.mission-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:0.5px solid var(--border);transition:opacity .2s;}
.mission-row:last-of-type{border-bottom:none;}
.mission-check{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s;cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext}=React;

// ── API ───────────────────────────────────────────────────
// Si la página la sirve el propio backend (localhost:3001 o Railway) usamos rutas relativas.
// Si se abre desde otro sitio, apuntamos al backend desplegado. Se puede forzar con localStorage "hp_api".
const REMOTE_API="https://lovely-magic-production-a3a2.up.railway.app";
const API=(()=>{
  try{const o=localStorage.getItem("hp_api");if(o)return o.replace(/\/$/,"");}catch{}
  const {protocol,hostname,port}=location;
  if(protocol==="file:") return REMOTE_API;
  if(hostname.endsWith(".railway.app")||port==="3001") return "";
  return REMOTE_API;
})();

async function api(method,path,body,token){
  const h={"Content-Type":"application/json"};
  if(token) h["Authorization"]=`Bearer ${token}`;
  let r;
  try{
    r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  }catch{
    throw new Error("No se pudo conectar con el servidor");
  }
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||"Error del servidor");e.status=r.status;throw e;}
  return d;
}

const lessonUrl=(courseId,n)=>`leccion.html?course=${encodeURIComponent(courseId)}${n?`&lesson=${n}`:""}`;

// ── Global state context ──────────────────────────────────
const Ctx=createContext(null);
function useApp(){return useContext(Ctx);}

// ── RANKS ─────────────────────────────────────────────────
const RANKS=[
  {name:"Recluta",icon:"ti-shield",color:"#888"},
  {name:"Guerrero",icon:"ti-sword",color:"#C0392B"},
  {name:"Héroe",icon:"ti-helmet",color:"#7B5EA7"},
  {name:"Leyenda",icon:"ti-crown",color:"#C9A84C"},
  {name:"Inmortal",icon:"ti-star",color:"#C0729E"},
];
const rankColor=n=>RANKS.find(r=>r.name===n)?.color||"#888";
const rankIcon=n=>RANKS.find(r=>r.name===n)?.icon||"ti-shield";

const STATUS={
  locked:{label:"🔒 Bloqueado",color:"var(--text3)"},
  soon:{label:"Próximamente",color:"var(--text3)"},
  new:{label:"Nuevo",color:null},
  progress:{label:"En curso",color:null},
  done:{label:"✦ Dominado",color:"var(--teal)"},
};

const ago=ts=>{
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000) return "ahora";
  if(d<3600000) return `${Math.floor(d/60000)}m`;
  if(d<86400000) return `${Math.floor(d/3600000)}h`;
  return `${Math.floor(d/86400000)}d`;
};
const initials=n=>(n||"H").slice(0,2).toUpperCase();

function Spinner({size=24,center}){
  const s=<span className="spinner" style={{width:size,height:size}}/>;
  return center?<div style={{textAlign:"center",padding:24}}>{s}</div>:s;
}

// ── XP Toast ──────────────────────────────────────────────
function XPToast({amount,x,y,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,1400);return()=>clearTimeout(t);},[]);
  return <div className="xp-toast" style={{left:x-40,top:y-20}}>+{amount} XP ⚡</div>;
}

// ── Recompensas (badges, bonos, cursos dominados) ─────────
function RewardStack({items,onDone}){
  useEffect(()=>{if(!items.length)return;const t=setTimeout(onDone,3600);return()=>clearTimeout(t);},[items]);
  if(!items.length) return null;
  return(
    <div style={{position:"fixed",top:60,left:0,right:0,zIndex:400,display:"flex",flexDirection:"column",alignItems:"center",gap:6,pointerEvents:"none",padding:"0 16px"}}>
      {items.map((r,i)=>(
        <div key={i} className="reward" style={{maxWidth:360,width:"100%",background:"rgba(18,18,26,0.97)",border:"0.5px solid var(--gold)",borderRadius:10,padding:"8px 12px",display:"flex",alignItems:"center",gap:8,fontSize:12}}>
          <i className={`ti ${r.label.startsWith("Badge")?"ti-award":r.label.startsWith("Curso")||r.label.startsWith("Rama")?"ti-trophy":"ti-bolt"}`} style={{color:"var(--gold)",fontSize:16}}/>
          <span style={{flex:1,color:"var(--text)"}}>{r.label}</span>
          <span style={{color:"var(--gold)",fontWeight:500}}>+{r.xp}</span>
        </div>
      ))}
    </div>
  );
}

// ── Rank Up Modal ─────────────────────────────────────────
function RankUpModal({from,to,onClose}){
  const c=rankColor(to);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="card rank-anim" style={{maxWidth:300,width:"100%",textAlign:"center",border:`1.5px solid ${c}`}}>
        <div style={{fontSize:56,marginBottom:12}}>🏆</div>
        <div style={{fontFamily:"var(--font-title)",fontSize:12,color:"var(--text3)",marginBottom:4}}>¡Nuevo rango desbloqueado!</div>
        <div style={{fontFamily:"var(--font-title)",fontSize:28,color:c,marginBottom:6}}>{to}</div>
        <div style={{fontSize:12,color:"var(--text2)",marginBottom:20}}>Superaste el rango <b style={{color:"var(--text)"}}>{from}</b>.<br/>Tu leyenda sigue creciendo.</div>
        <button onClick={onClose} className="btn btn-gold" style={{width:"100%"}}>¡A conquistar! <i className="ti ti-arrow-right"/></button>
      </div>
    </div>
  );
}

// ── Course sheet (detalle de curso con lecciones) ────────
function CourseSheet({courseId,onClose}){
  const {token}=useApp();
  const [course,setCourse]=useState(null);
  const [error,setError]=useState("");
  useEffect(()=>{
    api("GET",`/api/courses/${courseId}`,null,token).then(setCourse).catch(e=>setError(e.message));
  },[courseId]);

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:300,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} className="sheet" style={{width:"100%",maxWidth:480,maxHeight:"85vh",overflowY:"auto",background:"var(--bg2)",borderTop:"0.5px solid var(--border2)",borderRadius:"16px 16px 0 0",padding:"16px 16px 28px"}}>
        <div style={{width:36,height:4,borderRadius:2,background:"var(--bg4)",margin:"0 auto 14px"}}/>
        {error&&<div className="err">{error}</div>}
        {!course&&!error&&<Spinner center/>}
        {course&&(
          <>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
              <div className="icon-box" style={{width:42,height:42,borderRadius:10,background:`${course.color}18`,border:`0.5px solid ${course.color}`}}>
                <i className={`ti ${course.icon}`} style={{fontSize:20,color:course.color}}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:"var(--font-title)",fontSize:15,color:"var(--text)"}}>{course.title}</div>
                <div style={{fontSize:11,color:"var(--text3)"}}>{course.branchName} · Tier {course.tier} · {course.totalLessons} lecciones · {course.hours}</div>
              </div>
              <button onClick={onClose} aria-label="Cerrar"><i className="ti ti-x" style={{fontSize:18,color:"var(--text3)"}}/></button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <div className="prog-bar" style={{flex:1}}><div className="prog-fill" style={{width:`${course.pct}%`,background:course.status==="done"?"var(--teal)":course.color}}/></div>
              <span style={{fontSize:11,color:"var(--text2)"}}>{course.pct}%</span>
            </div>
            {!course.unlocked&&<div className="card-sm" style={{marginBottom:12,fontSize:12,color:"var(--text2)"}}><i className="ti ti-lock"/> Domina un curso del tier {course.tier-1} de la rama {course.branchName} para desbloquearlo.</div>}
            {course.lessons.map(l=>{
              const playable=course.unlocked&&l.available;
              const steps=[l.lesson,l.challenge,l.exam].filter(Boolean).length;
              return(
                <div key={l.n} style={{display:"flex",gap:10,alignItems:"center",padding:"9px 0",borderBottom:"0.5px solid var(--border)",opacity:playable?1:0.45}}>
                  <div className="icon-box" style={{width:24,height:24,borderRadius:"50%",fontSize:10,background:l.mastered?"var(--teal)":"var(--bg3)",border:`0.5px solid ${l.mastered?"var(--teal)":steps?course.color:"var(--border)"}`,color:l.mastered?"#0A0A0F":"var(--text2)"}}>
                    {l.mastered?<i className="ti ti-check" style={{fontSize:12}}/>:l.n}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,color:"var(--text)"}}>{l.title}</div>
                    <div style={{fontSize:10,color:"var(--text3)"}}>
                      {!l.available?"Próximamente":l.mastered?"Lección · Reto · Examen ✓":`${steps}/3 fases`}
                    </div>
                  </div>
                  {playable&&(
                    <a href={lessonUrl(course.id,l.n)} className="btn-chip" style={{borderColor:course.color,background:`${course.color}15`,color:course.color}}>
                      {l.mastered?"Repasar":steps?"Continuar":"Empezar"}
                    </a>
                  )}
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

// ── NAV ───────────────────────────────────────────────────
function Nav(){
  const {screen,setScreen}=useApp();
  const tabs=[
    {id:"home",icon:"ti-home",label:"Inicio"},
    {id:"tree",icon:"ti-topology-star",label:"Árbol"},
    {id:"school",icon:"ti-school",label:"Escuela"},
    {id:"library",icon:"ti-books",label:"Librería"},
    {id:"community",icon:"ti-users",label:"Comunidad"},
    {id:"profile",icon:"ti-user",label:"Perfil"},
  ];
  return(
    <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(18,18,26,0.97)",backdropFilter:"blur(12px)",borderTop:"0.5px solid var(--border2)",display:"flex",zIndex:100}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setScreen(t.id)}
          style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"10px 4px 10px",opacity:screen===t.id?1:0.38,transition:"opacity .2s"}}>
          <i className={`ti ${t.icon}`} style={{fontSize:22,color:screen===t.id?"var(--gold)":"var(--text)"}}/>
          <span style={{fontSize:9,fontWeight:screen===t.id?500:400,color:screen===t.id?"var(--gold)":"var(--text2)",letterSpacing:"0.04em",textTransform:"uppercase"}}>{t.label}</span>
        </button>
      ))}
    </nav>
  );
}

// ── AUTH ──────────────────────────────────────────────────
function Auth(){
  const {handleLogin}=useApp();
  const [mode,setMode]=useState("login");
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const submit=async e=>{
    e.preventDefault();setError("");setLoading(true);
    try{
      const path=mode==="login"?"/api/auth/login":"/api/auth/register";
      const body=mode==="login"?{email,password:pass}:{name,email,password:pass};
      const d=await api("POST",path,body);
      handleLogin(d.token);
    }catch(err){setError(err.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{marginBottom:32,textAlign:"center"}}>
        <i className="ti ti-topology-star" style={{fontSize:52,color:"var(--gold)",display:"block",marginBottom:12}}/>
        <h1 style={{fontFamily:"var(--font-title)",fontSize:30,color:"var(--gold)",letterSpacing:"0.1em"}}>HEROPATH</h1>
        <p style={{fontSize:13,color:"var(--text3)",marginTop:4}}>Tu camino legendario comienza aquí</p>
      </div>
      <div className="card" style={{width:"100%",maxWidth:380}}>
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {["login","register"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setError("");}}
              style={{flex:1,padding:"8px",borderRadius:8,border:`0.5px solid ${mode===m?"var(--gold)":"var(--border)"}`,
                background:mode===m?"rgba(201,168,76,0.1)":"transparent",
                color:mode===m?"var(--gold)":"var(--text2)",fontSize:12,fontWeight:mode===m?500:400,transition:"all .2s"}}>
              {m==="login"?"Iniciar sesión":"Crear cuenta"}
            </button>
          ))}
        </div>
        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:12}}>
          {mode==="register"&&<input className="input" placeholder="Tu nombre de héroe" value={name} onChange={e=>setName(e.target.value)} required minLength={2} maxLength={30}/>}
          <input className="input" type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="email"/>
          <input className="input" type="password" placeholder="Contraseña (mín. 6 caracteres)" value={pass} onChange={e=>setPass(e.target.value)} required minLength={6} autoComplete={mode==="login"?"current-password":"new-password"}/>
          {error&&<div className="err"><i className="ti ti-alert-circle"/> {error}</div>}
          <button type="submit" className="btn btn-gold" style={{width:"100%",marginTop:4}} disabled={loading}>
            {loading
              ?<Spinner size={18}/>
              :mode==="login"?"Entrar al reino":"Forjar mi legado"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Continue card ─────────────────────────────────────────
function ContinueCard(){
  const {catalog}=useApp();
  const next=catalog?.next;
  if(!catalog) return <div className="card" style={{marginBottom:14}}><Spinner center/></div>;
  if(!next) return(
    <div className="card" style={{marginBottom:14,textAlign:"center"}}>
      <i className="ti ti-trophy" style={{fontSize:28,color:"var(--gold)"}}/>
      <div style={{fontSize:12,color:"var(--text2)",marginTop:6}}>Has dominado todas las lecciones disponibles. ¡Pronto habrá más!</div>
    </div>
  );
  const stepLabel={lesson:"Lección",challenge:"Reto pendiente",exam:"Examen pendiente"}[next.step];
  return(
    <div className="card" style={{marginBottom:14,background:"linear-gradient(135deg,var(--bg2),#1A1228)",border:"0.5px solid rgba(123,94,167,0.4)"}}>
      <div style={{fontSize:10,color:"var(--purple-light)",fontWeight:500,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>{next.pct>0?"Continuando ahora":"Tu siguiente paso"}</div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10}}>
        <div className="icon-box" style={{width:38,height:38,borderRadius:9,background:`${next.color}18`,border:`0.5px solid ${next.color}`}}>
          <i className={`ti ${next.icon}`} style={{fontSize:18,color:next.color}}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:"var(--font-title)",fontSize:14,color:"var(--text)"}}>{next.courseTitle} · Lección {next.lessonNumber}</div>
          <div style={{fontSize:12,color:"var(--text2)"}}>{next.lessonTitle} · {stepLabel}</div>
        </div>
      </div>
      <div className="prog-bar" style={{marginBottom:12}}><div className="prog-fill" style={{width:`${next.pct}%`,background:"var(--purple)"}}/></div>
      <a href={lessonUrl(next.courseId,next.lessonNumber)} className="btn btn-gold" style={{fontSize:12,padding:"8px 16px"}}>
        <i className="ti ti-player-play"/> {next.pct>0?"Continuar":"Empezar"}
      </a>
    </div>
  );
}

// ── HOME ──────────────────────────────────────────────────
function Home(){
  const {user,token,missions,setMissions,celebrate}=useApp();

  useEffect(()=>{
    if(missions!==null) return;
    api("GET","/api/missions/today",null,token)
      .then(d=>setMissions(d))
      .catch(()=>setMissions({missions:[],completedCount:0,bonusXP:75}));
  },[token]); // eslint-disable-line

  const completeMission=async(m,e)=>{
    if(m.done||m.type==="advance") return;
    const rect=e.currentTarget.getBoundingClientRect();
    const setDone=done=>setMissions(prev=>{
      if(!prev)return prev;
      const updated=prev.missions.map(x=>x.id===m.id?{...x,done}:x);
      return {...prev,missions:updated,completedCount:updated.filter(x=>x.done).length};
    });
    setDone(true);
    try{
      const res=await api("PATCH",`/api/missions/${m.id}/complete`,null,token);
      celebrate(res,rect);
    }catch(err){
      if(err.status!==409) setDone(false);
    }
  };

  const [postText,setPostText]=useState("");
  const [posting,setPosting]=useState(false);
  const [postMsg,setPostMsg]=useState(null);

  const submitPost=async()=>{
    const text=postText.trim();
    if(text.length<5||text.length>280)return;
    setPosting(true);setPostMsg(null);
    try{
      const res=await api("POST","/api/posts",{text},token);
      setPostText("");
      setPostMsg({ok:true,text:"¡Publicado en el feed de la comunidad! 🔥"});
      celebrate(res);
      setTimeout(()=>setPostMsg(null),3000);
    }catch(err){setPostMsg({ok:false,text:err.message});}
    finally{setPosting(false);}
  };

  // Últimos 7 días terminando hoy; activos los últimos min(racha,7)
  const streak=user?.streak||0;
  const week=Array.from({length:7},(_,i)=>{
    const d=new Date(Date.now()-(6-i)*86400000);
    return {label:["D","L","M","X","J","V","S"][d.getDay()],active:6-i<Math.min(streak,7),today:i===6};
  });
  const span=user?.nextRankXP?user.nextRankXP-user.rankMin:1;
  const xpPct=user?.nextRankXP?Math.min(100,Math.round(((user.xp-user.rankMin)/span)*100)):100;
  const completedCount=missions?.completedCount||0;
  const missionList=missions?.missions||[];
  const allDone=completedCount===missionList.length&&missionList.length>0;
  const len=postText.trim().length;

  return(
    <div className="fade-in" style={{padding:"20px 16px 110px"}}>
      {/* Hero banner */}
      <div className="card" style={{marginBottom:14,background:"linear-gradient(135deg,var(--bg2),#1A1228)",border:"0.5px solid rgba(123,94,167,0.4)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <div className="icon-box" style={{width:48,height:48,borderRadius:"50%",background:"var(--purple-dark)",border:"1.5px solid var(--purple)",fontFamily:"var(--font-title)",fontSize:16,color:"var(--purple-light)"}}>
            {initials(user?.name)}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:"var(--font-title)",fontSize:14,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user?.name||"Héroe"}</div>
            <span className="pill" style={{background:`${rankColor(user?.rank)}22`,borderColor:rankColor(user?.rank),color:rankColor(user?.rank),marginTop:2}}>
              <i className={`ti ${rankIcon(user?.rank)}`} style={{fontSize:10}}/> {user?.rank||"Recluta"}
            </span>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontFamily:"var(--font-title)",fontSize:22,color:"var(--gold)"}}>{(user?.xp||0).toLocaleString()}</div>
            <div style={{fontSize:10,color:"var(--text3)"}}>XP total</div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
          <span style={{color:"var(--text2)"}}>{user?.nextRank?`→ ${user.nextRank}`:"Rango máximo"}</span>
          <span style={{color:"var(--gold)"}}>{xpPct}%</span>
        </div>
        <div className="prog-bar"><div className="prog-fill" style={{width:`${xpPct}%`,background:"var(--gold)"}}/></div>
        <div style={{fontSize:10,color:"var(--text3)",marginTop:3}}>
          {user?.nextRankXP?`${(user.nextRankXP-user.xp).toLocaleString()} XP para ${user.nextRank}`:"Has alcanzado la inmortalidad"}
        </div>
      </div>

      <ContinueCard/>

      {/* Streak */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <h3 style={{fontSize:13,color:"var(--gold)"}}>Racha activa</h3>
          <span style={{fontSize:13,color:"var(--orange)",fontWeight:500}}><i className="ti ti-flame"/> {streak} {streak===1?"día":"días"}</span>
        </div>
        <div style={{display:"flex",gap:5}}>
          {week.map((d,i)=>(
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div className="icon-box" style={{height:28,borderRadius:6,background:d.active?"rgba(201,168,76,0.2)":"var(--bg3)",border:`0.5px solid ${d.active?"var(--gold)":"var(--border)"}`,marginBottom:3}}>
                {d.active&&<i className="ti ti-check" style={{fontSize:12,color:"var(--gold)"}}/>}
              </div>
              <span style={{fontSize:9,color:d.today?"var(--text)":d.active?"var(--gold)":"var(--text3)",fontWeight:d.today?500:400}}>{d.label}</span>
            </div>
          ))}
        </div>
        <div style={{fontSize:10,color:"var(--text3)",marginTop:8}}>Récord: {user?.recordStreak||0} días · entra cada día para no perderla</div>
      </div>

      {/* Missions */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <h3 style={{fontSize:13,color:"var(--gold)"}}>Misiones de hoy</h3>
          <span style={{fontSize:11,color:"var(--text2)"}}>{completedCount}/{missionList.length}</span>
        </div>
        {missions===null
          ?<Spinner center/>
          :<>
            <div className="prog-bar" style={{marginBottom:10}}>
              <div className="prog-fill" style={{width:`${missionList.length?Math.round(completedCount/missionList.length*100):0}%`,background:allDone?"var(--teal)":"var(--purple)"}}/>
            </div>
            {allDone&&(
              <div className="ok" style={{marginBottom:10,fontSize:11}}>¡Bono de +{missions.bonusXP} XP desbloqueado! Todas las misiones completadas 🎉</div>
            )}
            {missionList.map(m=>(
              <div key={m.id} className="mission-row" style={{opacity:m.done?0.5:1}}>
                <div className="icon-box" style={{width:32,height:32,borderRadius:8,background:m.done?"rgba(43,191,160,0.12)":"rgba(255,255,255,0.04)",border:`0.5px solid ${m.done?"var(--teal)":"var(--border)"}`}}>
                  <i className={`ti ${m.icon||"ti-target"}`} style={{fontSize:15,color:m.done?"var(--teal)":"var(--text2)"}}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:"var(--text)",textDecoration:m.done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.title}</div>
                  <div style={{fontSize:10,color:"var(--text3)"}}>
                    {m.branch} · +{m.xp} XP{m.type==="surprise"?" · sorpresa ✨":""}{m.type==="advance"&&!m.done?" · se completa al avanzar":""}
                  </div>
                </div>
                {m.type==="advance"&&!m.done
                  ?<a href={lessonUrl(m.courseId)} className="btn-chip" style={{borderColor:"var(--purple)",color:"var(--purple-light)",background:"rgba(123,94,167,0.12)"}}>Ir <i className="ti ti-arrow-right"/></a>
                  :<button
                    onClick={e=>completeMission(m,e)}
                    disabled={m.done}
                    aria-label={m.done?"Completada":"Marcar como completada"}
                    className="mission-check"
                    style={{border:`0.5px solid ${m.done?"var(--teal)":"var(--border2)"}`,background:m.done?"var(--teal)":"transparent",cursor:m.done?"default":"pointer"}}>
                    {m.done&&<i className="ti ti-check" style={{fontSize:12,color:"#0A0A0F"}}/>}
                  </button>}
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:11,color:"var(--text3)"}}>
              <span>Bono al completar las {missionList.length}</span>
              <span style={{color:"var(--gold)"}}>+{missions.bonusXP} XP</span>
            </div>
          </>
        }
      </div>

      {/* Stats rápidos */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {[{n:"#"+(user?.pos||"—"),l:"Ranking",c:"var(--purple-light)"},{n:String(user?.lessonsCompleted||0),l:"Lecciones",c:"var(--teal)"},{n:String(user?.badgesCount||0),l:"Badges",c:"var(--gold)"}].map((s,i)=>(
          <div key={i} className="card-sm" style={{textAlign:"center"}}>
            <div style={{fontFamily:"var(--font-title)",fontSize:17,color:s.c}}>{s.n}</div>
            <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Comparte tu avance */}
      <div className="card">
        <h3 style={{fontSize:13,color:"var(--gold)",marginBottom:10}}>Comparte tu avance</h3>
        <textarea
          className="input"
          rows={3}
          maxLength={300}
          placeholder="¿Qué lograste hoy? Inspira a la comunidad Heroes..."
          value={postText}
          onChange={e=>setPostText(e.target.value)}
          style={{resize:"none",marginBottom:8,lineHeight:1.6}}
        />
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:11,color:len>=5&&len<=280?"var(--teal)":"var(--text3)"}}>{len} / 280</span>
          {len>280&&<span style={{fontSize:11,color:"var(--red)"}}>Demasiado largo</span>}
        </div>
        {postMsg&&<div className={postMsg.ok?"ok":"err"} style={{marginBottom:8}}>{postMsg.text}</div>}
        <button
          onClick={submitPost}
          disabled={posting||len<5||len>280}
          className="btn btn-gold"
          style={{width:"100%",opacity:len>=5&&len<=280?1:0.4}}>
          {posting
            ?<><Spinner size={16}/> Publicando...</>
            :<><i className="ti ti-send"/> Publicar en comunidad</>}
        </button>
      </div>
    </div>
  );
}

      })}

}

function School(){
  const {catalog,openCourse}=useApp();
  const [filter,setFilter]=useState("todos");
  if(!catalog) return <Spinner center/>;
  const courses=catalog.branches.flatMap(b=>b.courses);
  const filtered=courses.filter(c=>
    filter==="todos"?true
    :filter==="progreso"?c.status==="progress"
    :filter==="completo"?c.status==="done"
    :c.status==="new");
  const available=courses.reduce((s,c)=>s+c.availableLessons,0);

  return(
    <div className="fade-in" style={{padding:"20px 16px 110px"}}>
      <h2 style={{fontSize:18,color:"var(--gold)",marginBottom:4}}>Escuela</h2>
      <p style={{fontSize:12,color:"var(--text2)",marginBottom:12}}>{courses.length} cursos · {available} lecciones disponibles · lección +50 · reto +100 · examen +150 XP</p>

      <ContinueCard/>

      <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:4}}>
        {[["todos","Todos"],["progreso","En curso"],["completo","Dominados"],["sin","Sin iniciar"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} className="pill"
            style={{flexShrink:0,background:filter===v?"var(--purple)":"transparent",
              borderColor:filter===v?"var(--purple)":"var(--border2)",
              color:filter===v?"white":"var(--text2)"}}>
            {l}
          </button>
        ))}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.length===0&&<div style={{textAlign:"center",color:"var(--text3)",padding:24,fontSize:12}}>No hay cursos en esta categoría todavía.</div>}
        {filtered.map(c=>{
          const locked=c.status==="locked",soon=c.status==="soon",done=c.status==="done";
          return(
            <button key={c.id} onClick={()=>openCourse(c.id)} className="card-sm" style={{display:"flex",gap:10,alignItems:"center",opacity:locked||soon?0.45:1,textAlign:"left",width:"100%"}}>
              <div className="icon-box" style={{width:36,height:36,borderRadius:8,background:`${c.color}10`,border:`0.5px solid ${done?"var(--teal)":locked?"var(--border)":c.color}`}}>
                <i className={`ti ${done?"ti-check":locked?"ti-lock":c.icon}`} style={{fontSize:16,color:done?"var(--teal)":locked?"var(--text3)":c.color}}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:500,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</div>
                <div style={{fontSize:10,color:"var(--text3)"}}>{c.branchName} · {c.totalLessons} lecciones · {c.hours}</div>
                {c.pct>0&&<div className="prog-bar" style={{marginTop:4}}><div className="prog-fill" style={{width:`${c.pct}%`,background:done?"var(--teal)":c.color}}/></div>}
              </div>
              <span className="btn-chip" style={{borderColor:locked||soon?"var(--border)":c.color,color:STATUS[c.status].color||c.color,background:locked||soon?"transparent":`${c.color}15`}}>
                {STATUS[c.status].label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── LIBRARY ───────────────────────────────────────────────
function Library(){
  const {token,celebrate}=useApp();
  const [items,setItems]=useState(null);
  const [filter,setFilter]=useState("Todos");
  const [open,setOpen]=useState(null);
  const [busy,setBusy]=useState(null);

  useEffect(()=>{api("GET","/api/library",null,token).then(setItems).catch(()=>setItems([]));},[token]);

  const complete=async(r,e)=>{
    if(busy||r.done) return;
    setBusy(r.id);
    const rect=e.currentTarget.getBoundingClientRect();
    try{
      const res=await api("POST",`/api/library/${r.id}/complete`,null,token);
      setItems(prev=>prev.map(x=>x.id===r.id?{...x,done:true}:x));
      celebrate(res,rect);
    }catch(err){
      if(err.status===409) setItems(prev=>prev.map(x=>x.id===r.id?{...x,done:true}:x));
    }finally{setBusy(null);}
  };

  if(!items) return <Spinner center/>;
  const filtered=filter==="Todos"?items:items.filter(r=>r.type===filter);
  const doneCount=items.filter(r=>r.done).length;

  return(
    <div className="fade-in" style={{padding:"20px 16px 110px"}}>
      <h2 style={{fontSize:18,color:"var(--gold)",marginBottom:4}}>Librería</h2>
      <p style={{fontSize:12,color:"var(--text2)",marginBottom:12}}>{doneCount}/{items.length} completados · cada recurso suma +25 XP</p>
      <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
        {["Todos","Libro","Video","Guía PDF","Audio"].map(t=>(
          <button key={t} onClick={()=>setFilter(t)} className="pill"
            style={{flexShrink:0,background:filter===t?"var(--gold)":"transparent",borderColor:filter===t?"var(--gold)":"var(--border2)",color:filter===t?"var(--bg)":"var(--text2)"}}>
            {t}
          </button>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(r=>(
          <div key={r.id} className="card-sm">
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div className="icon-box" style={{width:36,height:36,borderRadius:8,background:`${r.color}10`,border:`0.5px solid ${r.done?"var(--teal)":r.color}`}}>
                <i className={`ti ${r.done?"ti-check":r.icon}`} style={{fontSize:16,color:r.done?"var(--teal)":r.color}}/>
              </div>
              <button onClick={()=>setOpen(open===r.id?null:r.id)} style={{flex:1,minWidth:0,textAlign:"left"}}>
                <div style={{fontSize:12,fontWeight:500,color:"var(--text)",marginBottom:1}}>{r.title}</div>
                <div style={{fontSize:11,color:"var(--text3)"}}>{r.type} · {r.branch} <i className={`ti ti-chevron-${open===r.id?"up":"down"}`}/></div>
              </button>
              <button onClick={e=>complete(r,e)} disabled={busy===r.id||r.done} className="btn-chip"
                style={{borderColor:r.done?"var(--teal)":r.color,background:r.done?"rgba(43,191,160,0.1)":`${r.color}12`,color:r.done?"var(--teal)":r.color}}>
                {busy===r.id?<Spinner size={12}/>:r.done?"Completado":`+${r.xp} XP`}
              </button>
            </div>
            {open===r.id&&<p className="fade-in" style={{fontSize:12,color:"var(--text2)",marginTop:8,lineHeight:1.6}}>{r.summary}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── COMMUNITY ─────────────────────────────────────────────
function Post({p,onChange,onDelete}){
  const {token,user}=useApp();
  const [showComments,setShowComments]=useState(false);
  const [comment,setComment]=useState("");
  const [sending,setSending]=useState(false);
  const c=rankColor(p.userRank||"Recluta");
  const isMe=p.userId===user?.id;

  const toggleLike=async()=>{
    onChange({...p,likedByMe:!p.likedByMe,likeCount:p.likeCount+(p.likedByMe?-1:1)});
    try{
      const res=await api("POST",`/api/posts/${p._id}/like`,null,token);
      onChange({...p,likedByMe:res.liked,likeCount:res.likeCount});
    }catch{onChange(p);}
  };

  const sendComment=async e=>{
    e.preventDefault();
    if(comment.trim().length<2) return;
    setSending(true);
    try{
      const res=await api("POST",`/api/posts/${p._id}/comment`,{text:comment},token);
      onChange({...p,comments:[...p.comments,res]});
      setComment("");
    }catch(err){alert(err.message);}
    finally{setSending(false);}
  };

  return(
    <div className="card" style={{marginBottom:10,border:isMe?"0.5px solid rgba(201,168,76,0.3)":"0.5px solid var(--border)"}}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
        <div className="icon-box" style={{width:30,height:30,borderRadius:"50%",background:`${c}22`,border:`0.5px solid ${c}`,fontSize:11,fontWeight:500,color:c}}>{initials(p.userName)}</div>
        <div style={{flex:1,minWidth:0}}>
          <span style={{fontSize:12,fontWeight:500,color:"var(--text)"}}>{p.userName}</span>
          {isMe&&<span style={{fontSize:10,color:"var(--gold)",marginLeft:6}}>· tú</span>}
          <span className="pill" style={{marginLeft:6,fontSize:9,background:`${c}15`,borderColor:c,color:c}}>{p.userRank||"Recluta"}</span>
        </div>
        <span style={{fontSize:10,color:"var(--text3)"}}>{ago(p.createdAt)}</span>
      </div>
      {p.achievement&&<div className="pill" style={{marginBottom:6,background:"rgba(230,126,34,0.12)",borderColor:"var(--orange)",color:"var(--orange)",fontSize:10}}><i className="ti ti-target"/> {p.achievement.title}</div>}
      <p style={{fontSize:12,color:"var(--text2)",lineHeight:1.7,marginBottom:10,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{p.text}</p>
      <div style={{display:"flex",gap:14}}>
        <button onClick={toggleLike} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:p.likedByMe?"var(--orange)":"var(--text3)"}}>
          <i className="ti ti-flame" style={{fontSize:15}}/>{p.likeCount}
        </button>
        <button onClick={()=>setShowComments(s=>!s)} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:showComments?"var(--gold)":"var(--text3)"}}>
          <i className="ti ti-message-circle" style={{fontSize:15}}/>{p.comments.length}
        </button>
        {isMe&&<button onClick={()=>confirm("¿Borrar esta publicación?")&&onDelete(p)} style={{marginLeft:"auto",fontSize:11,color:"var(--text3)"}}><i className="ti ti-trash" style={{fontSize:14}}/></button>}
      </div>
      {showComments&&(
        <div className="fade-in" style={{marginTop:10,paddingTop:10,borderTop:"0.5px solid var(--border)"}}>
          {p.comments.map((cm,i)=>(
            <div key={i} style={{fontSize:12,marginBottom:6,lineHeight:1.5}}>
              <b style={{color:"var(--text)",fontWeight:500}}>{cm.userName}</b> <span style={{color:"var(--text2)"}}>{cm.text}</span>
              <span style={{fontSize:10,color:"var(--text3)",marginLeft:6}}>{ago(cm.createdAt)}</span>
            </div>
          ))}
          <form onSubmit={sendComment} style={{display:"flex",gap:6,marginTop:6}}>
            <input className="input" value={comment} onChange={e=>setComment(e.target.value)} placeholder="Escribe un comentario..." maxLength={280} style={{padding:"7px 10px",fontSize:12}}/>
            <button type="submit" disabled={sending||comment.trim().length<2} className="btn btn-gold" style={{padding:"6px 12px",opacity:comment.trim().length<2?0.4:1}}>
              {sending?<Spinner size={12}/>:<i className="ti ti-send"/>}
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

function Community(){
  const {token}=useApp();
  const [tab,setTab]=useState("feed");
  const [posts,setPosts]=useState([]);
  const [lb,setLb]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  useEffect(()=>{
    setLoading(true);setError("");
    const load=tab==="feed"
      ?api("GET","/api/posts",null,token).then(setPosts)
      :api("GET","/api/leaderboard?limit=20",null,token).then(setLb);
    load.catch(e=>setError(e.message)).finally(()=>setLoading(false));
  },[tab,token]);

  const updatePost=p=>setPosts(prev=>prev.map(x=>x._id===p._id?p:x));
  const deletePost=async p=>{
    try{await api("DELETE",`/api/posts/${p._id}`,null,token);setPosts(prev=>prev.filter(x=>x._id!==p._id));}
    catch(err){alert(err.message);}
  };

  return(
    <div className="fade-in" style={{padding:"20px 16px 110px"}}>
      <h2 style={{fontSize:18,color:"var(--gold)",marginBottom:12}}>Comunidad</h2>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[["feed","Feed"],["ranking","Ranking"]].map(([v,l])=>(
          <button key={v} onClick={()=>setTab(v)} className="pill"
            style={{background:tab===v?"var(--gold)":"transparent",borderColor:tab===v?"var(--gold)":"var(--border2)",color:tab===v?"var(--bg)":"var(--text2)"}}>
            {l}
          </button>
        ))}
      </div>

      {loading&&<Spinner size={28} center/>}
      {error&&<div className="err">{error}</div>}

      {!loading&&!error&&tab==="feed"&&(
        posts.length===0
          ?<div style={{textAlign:"center",color:"var(--text3)",padding:40}}>
            <i className="ti ti-message-circle" style={{fontSize:40,display:"block",marginBottom:8}}/>
            Nadie ha publicado aún.<br/>¡Ve a Inicio y comparte tu avance!
          </div>
          :posts.map(p=><Post key={p._id} p={p} onChange={updatePost} onDelete={deletePost}/>)
      )}

      {!loading&&!error&&tab==="ranking"&&lb&&(
        <div>
          {lb.myEntry&&(
            <div style={{marginBottom:12,padding:"10px 14px",background:"rgba(123,94,167,0.1)",border:"0.5px solid rgba(123,94,167,0.4)",borderRadius:10}}>
              <div style={{fontSize:11,color:"var(--purple-light)",marginBottom:4}}>Tu posición global</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontFamily:"var(--font-title)",fontSize:24,color:"var(--purple-light)"}}>#{lb.myEntry.pos}</span>
                <span style={{fontSize:12,color:"var(--text2)"}}>de {lb.total} héroes</span>
                <span style={{fontFamily:"var(--font-title)",fontSize:14,color:"var(--gold)"}}>{(lb.myEntry.xp||0).toLocaleString()} XP</span>
              </div>
            </div>
          )}
          {(lb.leaderboard||[]).map((u,i)=>{
            const c=rankColor(u.rank);
            return(
              <div key={u.id} className="card-sm" style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,background:u.isMe?"rgba(201,168,76,0.06)":"var(--bg3)",border:u.isMe?"0.5px solid rgba(201,168,76,0.3)":"0.5px solid var(--border)"}}>
                <div style={{width:22,textAlign:"center",fontFamily:"var(--font-title)",fontSize:12,color:i===0?"var(--gold)":i===1?"#B4B2A9":i===2?"#CD7F32":"var(--text3)",flexShrink:0}}>{u.pos}</div>
                <div className="icon-box" style={{width:28,height:28,borderRadius:"50%",background:`${c}22`,border:`0.5px solid ${c}`,fontSize:10,fontWeight:500,color:c}}>{initials(u.name)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:u.isMe?"var(--gold)":"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name}{u.isMe?" (tú)":""}</div>
                  <div style={{fontSize:10,color:"var(--text3)"}}>{u.rank} · racha {u.streak}d</div>
                </div>
                <div style={{fontSize:12,fontWeight:500,color:"var(--purple-light)",flexShrink:0}}>{(u.xp||0).toLocaleString()}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── PROFILE ───────────────────────────────────────────────
function Profile(){
  const {user,token,catalog,handleLogout}=useApp();
  const [badges,setBadges]=useState([]);
  const [tab,setTab]=useState("stats");
  const [loading,setLoading]=useState(true);
  const [selBadge,setSelBadge]=useState(null);

  useEffect(()=>{
    api("GET","/api/badges",null,token).then(setBadges).catch(()=>{}).finally(()=>setLoading(false));
  },[token]);

  const earned=badges.filter(b=>b.earned);
  const locked=badges.filter(b=>!b.earned);
  const since=user?.createdAt?new Date(user.createdAt).toLocaleDateString("es",{month:"long",year:"numeric"}):"";

  const BadgeTile=({b})=>(
    <button onClick={()=>setSelBadge(selBadge?.id===b.id?null:b)} style={{textAlign:"center",padding:"8px 4px",borderRadius:8,background:b.earned?"rgba(201,168,76,0.06)":"var(--bg3)",border:`0.5px solid ${selBadge?.id===b.id?"var(--gold)":b.earned?"rgba(201,168,76,0.25)":"var(--border)"}`,opacity:b.earned?1:0.45}}>
      <i className={`ti ${b.earned?b.icon:"ti-lock"}`} style={{fontSize:22,color:b.earned?"var(--gold)":"var(--text3)",display:"block",marginBottom:3}}/>
      <div style={{fontSize:9,color:b.earned?"var(--gold)":"var(--text3)",lineHeight:1.2}}>{b.name}</div>
    </button>
  );

  return(
    <div className="fade-in" style={{padding:"20px 16px 110px"}}>
      <div className="card" style={{marginBottom:16,textAlign:"center",background:"linear-gradient(135deg,#1A1228,#12101A)",border:"0.5px solid rgba(123,94,167,0.4)"}}>
        <div className="icon-box" style={{width:64,height:64,borderRadius:"50%",background:"var(--purple-dark)",border:"2px solid var(--purple)",margin:"0 auto 10px",fontFamily:"var(--font-title)",fontSize:20,color:"var(--purple-light)"}}>
          {initials(user?.name)}
        </div>
        <h2 style={{fontFamily:"var(--font-title)",fontSize:16,color:"var(--text)",marginBottom:2}}>{user?.name}</h2>
        {since&&<div style={{fontSize:10,color:"var(--text3)",marginBottom:8}}>Héroe desde {since}</div>}
        <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:12}}>
          <span className="pill" style={{background:`${rankColor(user?.rank)}22`,borderColor:rankColor(user?.rank),color:rankColor(user?.rank)}}>
            <i className={`ti ${rankIcon(user?.rank)}`} style={{fontSize:11}}/> {user?.rank}
          </span>
          <span className="pill" style={{background:"rgba(230,126,34,0.15)",borderColor:"var(--orange)",color:"var(--orange)"}}>
            <i className="ti ti-flame" style={{fontSize:11}}/> {user?.streak||0} {user?.streak===1?"día":"días"}
          </span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {[{n:(user?.xp||0).toLocaleString(),l:"XP total"},{n:user?.lessonsCompleted||0,l:"Lecciones"},{n:user?.coursesCompleted||0,l:"Cursos"},{n:`${user?.recordStreak||0}d`,l:"Récord"}].map((s,i)=>(
            <div key={i}>
              <div style={{fontFamily:"var(--font-title)",fontSize:16,color:"var(--gold)"}}>{s.n}</div>
              <div style={{fontSize:10,color:"var(--text3)"}}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["stats","Estadísticas"],["badges",`Badges · ${earned.length}`]].map(([v,l])=>(
          <button key={v} onClick={()=>setTab(v)} className="pill"
            style={{flex:1,justifyContent:"center",background:tab===v?"var(--gold)":"transparent",borderColor:tab===v?"var(--gold)":"var(--border2)",color:tab===v?"var(--bg)":"var(--text2)"}}>
            {l}
          </button>
        ))}
      </div>

      {tab==="stats"&&(
        <div className="card">
          <h3 style={{fontSize:12,color:"var(--gold)",marginBottom:12}}>Progreso por rama</h3>
          {!catalog?<Spinner center/>:catalog.branches.map(b=>(
            <div key={b.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div className="icon-box" style={{width:20,height:20,borderRadius:5,background:`${b.color}15`}}>
                <i className={`ti ${b.icon}`} style={{fontSize:11,color:b.color}}/>
              </div>
              <span style={{fontSize:11,color:"var(--text2)",width:74,flexShrink:0}}>{b.name}</span>
              <div className="prog-bar" style={{flex:1}}><div className="prog-fill" style={{width:`${b.pct}%`,background:b.color}}/></div>
              <span style={{fontSize:10,color:b.color,width:30,textAlign:"right",flexShrink:0}}>{b.pct}%</span>
            </div>
          ))}
        </div>
      )}

      {tab==="badges"&&(
        <div>
          {loading?<Spinner center/>:(
            <>
              {selBadge&&(
                <div className="card-sm fade-in" style={{marginBottom:12,display:"flex",gap:10,alignItems:"center",border:"0.5px solid var(--gold)"}}>
                  <i className={`ti ${selBadge.icon}`} style={{fontSize:26,color:selBadge.earned?"var(--gold)":"var(--text3)"}}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:500,color:"var(--text)"}}>{selBadge.name} · +{selBadge.xp} XP</div>
                    <div style={{fontSize:11,color:"var(--text2)"}}>{selBadge.desc}</div>
                    {selBadge.earnedAt&&<div style={{fontSize:10,color:"var(--teal)"}}>Obtenido el {new Date(selBadge.earnedAt).toLocaleDateString("es")}</div>}
                  </div>
                </div>
              )}
              <div style={{fontSize:11,color:"var(--gold)",marginBottom:8,fontWeight:500}}>Ganados · {earned.length}</div>
              {earned.length===0&&<div style={{fontSize:12,color:"var(--text3)",marginBottom:12}}>Aún no has ganado ningún badge. ¡Completa tu primera lección!</div>}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:16}}>
                {earned.map(b=><BadgeTile key={b.id} b={b}/>)}
              </div>
              <div style={{fontSize:11,color:"var(--text3)",marginBottom:8,fontWeight:500}}>Por desbloquear · {locked.length} · toca para ver cómo</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
                {locked.map(b=><BadgeTile key={b.id} b={b}/>)}
              </div>
            </>
          )}
        </div>
      )}

      <button onClick={handleLogout} className="btn btn-ghost" style={{width:"100%",marginTop:20,borderColor:"rgba(192,57,43,0.3)",color:"var(--red)"}}>
        <i className="ti ti-logout"/> Cerrar sesión
      </button>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────
function App(){
  const [token,setToken]=useState(()=>localStorage.getItem("hp_token")||null);
  const [user,setUser]=useState(null);
  const [screen,setScreenState]=useState(()=>sessionStorage.getItem("hp_screen")||"home");
  const [loading,setLoading]=useState(!!token);
  const [rankUp,setRankUp]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [rewards,setRewards]=useState([]);
  const [missions,setMissions]=useState(null);
  const [catalog,setCatalog]=useState(null);
  const [courseSheet,setCourseSheet]=useState(null);
  const prevRankRef=useRef(null);

  const setScreen=s=>{setScreenState(s);try{sessionStorage.setItem("hp_screen",s);}catch{}window.scrollTo(0,0);};

  const handleLogout=useCallback(()=>{
    localStorage.removeItem("hp_token");
    setToken(null);setUser(null);setScreenState("home");setMissions(null);setCatalog(null);
  },[]);

  const refreshUser=useCallback(async()=>{
    if(!token) return;
    try{
      const fresh=await api("GET","/api/auth/me",null,token);
      if(prevRankRef.current&&fresh.rank!==prevRankRef.current) setRankUp({from:prevRankRef.current,to:fresh.rank});
      prevRankRef.current=fresh.rank;
      setUser(fresh);
    }catch(err){if(err.status===401) handleLogout();}
  },[token]);

  const reloadCatalog=useCallback(()=>{
    if(!token) return;
    api("GET","/api/catalog",null,token).then(setCatalog).catch(()=>{});
  },[token]);

  // Carga inicial y al volver de una lección (pestaña visible otra vez / bfcache)
  useEffect(()=>{
    if(!token){setLoading(false);return;}
    refreshUser().finally(()=>setLoading(false));
    reloadCatalog();
    const onBack=()=>{if(document.visibilityState==="visible"){refreshUser();reloadCatalog();setMissions(null);}};
    document.addEventListener("visibilitychange",onBack);
    window.addEventListener("pageshow",onBack);
    return()=>{document.removeEventListener("visibilitychange",onBack);window.removeEventListener("pageshow",onBack);};
  },[token]);

  const handleLogin=tok=>{
    localStorage.setItem("hp_token",tok);
    prevRankRef.current=null;
    setMissions(null);setCatalog(null);setLoading(true);
    setToken(tok);
  };

  const addToast=(amount,x,y)=>setToasts(prev=>[...prev,{id:Date.now()+Math.random(),amount,x,y}]);
  const removeToast=id=>setToasts(prev=>prev.filter(t=>t.id!==id));

  // Muestra la XP ganada, recompensas extra (badges, bonos) y refresca el estado
  const celebrate=(res,rect)=>{
    if(res?.earned){
      const x=rect?rect.left+rect.width/2:window.innerWidth/2;
      const y=rect?rect.top:window.innerHeight/2;
      addToast(res.earned,x,y);
    }
    const extra=(res?.rewards||[]).filter((r,i)=>i>0||/^(Badge|Bono|Curso|Rama)/.test(r.label));
    if(extra.length) setRewards(extra);
    refreshUser();
    reloadCatalog();
  };

  const ctx={token,user,screen,setScreen,missions,setMissions,refreshUser,handleLogin,handleLogout,celebrate,catalog,reloadCatalog,openCourse:setCourseSheet};

  if(loading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <i className="ti ti-topology-star" style={{fontSize:52,color:"var(--gold)"}}/>
      <Spinner size={32}/>
    </div>
  );

  if(!token||!user) return <Ctx.Provider value={ctx}><Auth/></Ctx.Provider>;

  const screens={home:<Home/>,tree:<Tree/>,school:<School/>,library:<Library/>,community:<Community/>,profile:<Profile/>};

  return(
    <Ctx.Provider value={ctx}>
      {toasts.map(t=><XPToast key={t.id} amount={t.amount} x={t.x} y={t.y} onDone={()=>removeToast(t.id)}/>)}
      <RewardStack items={rewards} onDone={()=>setRewards([])}/>
      {rankUp&&<RankUpModal from={rankUp.from} to={rankUp.to} onClose={()=>setRankUp(null)}/>}
      {courseSheet&&<CourseSheet courseId={courseSheet} onClose={()=>setCourseSheet(null)}/>}

      <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh"}}>
        <header style={{position:"sticky",top:0,zIndex:50,background:"rgba(10,10,15,0.95)",backdropFilter:"blur(12px)",borderBottom:"0.5px solid var(--border)",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={()=>setScreen("home")} style={{display:"flex",alignItems:"center",gap:8}}>
            <i className="ti ti-topology-star" style={{fontSize:20,color:"var(--gold)"}}/>
            <span style={{fontFamily:"var(--font-title)",fontSize:15,color:"var(--gold)",letterSpacing:"0.08em"}}>HeroPath</span>
          </button>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:12,color:"var(--orange)",fontWeight:500}}><i className="ti ti-flame"/> {user.streak||0}</span>
            <span style={{fontSize:12,color:"var(--purple-light)",fontWeight:500}}><i className="ti ti-star"/> {(user.xp||0).toLocaleString()} XP</span>
          </div>
        </header>
        <main>{screens[screen]||<Home/>}</main>
        <Nav/>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
